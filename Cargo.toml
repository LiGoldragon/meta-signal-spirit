[package]
name         = "meta-signal-spirit"
version      = "0.7.1"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/meta-signal-spirit"
description  = "MetaSignal contract for privileged spirit lifecycle and policy."
publish      = false
links        = "meta-signal-spirit"
build        = "build.rs"

[lib]
name = "meta_signal_spirit"
path = "src/lib.rs"

[features]
default = []
nota-text = ["dep:nota", "signal-domain/nota-text", "signal-frame/nota-text", "signal-spirit/nota-text"]

[dependencies]
signal-domain = { git = "https://github.com/LiGoldragon/signal-domain.git", rev = "4ea4892d717247cce2d0c221b100314077f3fa3d", default-features = false }
signal-frame  = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "0786fbe8caf27552afcdd5deb85bc82ec6088337", default-features = false }
signal-spirit = { git = "https://github.com/LiGoldragon/signal-spirit.git", rev = "0c3abd83b5aa2f5769eee1ab519a38c58b93515b", default-features = false }
nota     = { package = "nota", git = "https://github.com/LiGoldragon/nota.git", rev = "89dc3c85a9ff96d4e4d53accfd867df672cae5a8", optional = true }
rkyv          = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
thiserror     = "2"

[build-dependencies]
protos = { git = "https://github.com/LiGoldragon/protos.git", rev = "4cb55c87174db23ba21237f5975bf97b4c0690b5" }
schema-rust = { package = "schema-rust", git = "https://github.com/LiGoldragon/schema-rust.git", rev = "c322127d85f442eb7a0d3152d8bacea638d3f6ea", default-features = false, features = ["cli"] }

[dev-dependencies]
nota = { package = "nota", git = "https://github.com/LiGoldragon/nota.git", rev = "89dc3c85a9ff96d4e4d53accfd867df672cae5a8" }
schema-language = { git = "https://github.com/LiGoldragon/schema-language.git", rev = "9c217610c4b8d3bdaa9f95542e28c04424a593e3" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
