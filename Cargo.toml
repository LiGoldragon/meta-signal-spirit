[package]
name         = "meta-signal-spirit"
version      = "0.9.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/meta-signal-spirit"
description  = "MetaSignal contract for privileged spirit lifecycle and policy."
publish      = false
links        = "meta-signal-spirit"
build        = "build.rs"

[lib]
name = "meta_signal_spirit"
path = "src/lib.rs"

[dependencies]
signal-domain = { git = "https://github.com/LiGoldragon/signal-domain.git", rev = "cc97101ebaff3173b55dd014bf1dda511534e011", default-features = false }
signal-spirit = { git = "https://github.com/LiGoldragon/signal-spirit.git", rev = "d3690ae", default-features = false }
protos = { git = "https://github.com/LiGoldragon/protos.git", rev = "d06c4a9" }

[build-dependencies]
name-table = { git = "https://github.com/LiGoldragon/name-table.git", rev = "7dd5db15c16b4246c83d049c759415d3252a7d43" }
rust-logos = { git = "https://github.com/LiGoldragon/rust-logos.git", rev = "728647e" }
schema-rust = { git = "https://github.com/LiGoldragon/schema-rust.git", rev = "d28ead7" }
sema-translator = { git = "https://github.com/LiGoldragon/sema-translator.git", rev = "118d7a3", default-features = false, features = ["bootstrap"] }
core-nomos = { git = "https://github.com/LiGoldragon/core-nomos.git", rev = "419dcba" }

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
